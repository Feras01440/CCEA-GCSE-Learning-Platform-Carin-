<!doctype html><html><head><meta charset="utf-8"><title>swatches</title>
<style>
body{margin:0;background:lch(97.5% 2.4 85);font:14px "Inter",system-ui;color:lch(18% 3 85);padding:16px;}
.g{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:18px;}
.s{border-radius:8px;padding:10px 8px;color:#fff;font-size:11px;line-height:1.3;min-height:64px;}
h3{margin:14px 0 8px;font-size:13px;}
</style></head><body>
<h3>maths candidates — L40</h3>
<div class="g" id="a"></div>
<h3>maths candidates — L36, lower chroma</h3>
<div class="g" id="b"></div>
<h3>further maths (heather)</h3>
<div class="g" id="c"></div>
<h3>science (lichen)</h3>
<div class="g" id="d"></div>
<h3>root / cairn (near-ink slate)</h3>
<div class="g" id="e"></div>
<h3>semantics</h3>
<div class="g" id="f"></div>
<script>
function row(id, list){
  document.getElementById(id).innerHTML = list.map(([l,c,h])=>{
    const col = `lch(${l}% ${c} ${h})`;
    return `<div class="s" style="background:${col}">${l} / ${c} / ${h}</div>`;
  }).join("");
}
row("a", [[40,34,248],[40,26,258],[40,22,266],[40,18,272],[40,26,278],[40,30,288]]);
row("b", [[36,24,262],[36,20,268],[36,16,270],[38,22,270],[38,18,276],[34,20,268]]);
row("c", [[42,32,322],[42,26,330],[42,22,340],[40,28,318],[40,24,348],[42,20,330]]);
row("d", [[38,30,160],[38,24,150],[38,20,145],[36,22,155],[40,26,148],[38,18,158]]);
row("e", [[34,16,262],[30,12,262],[26,10,262],[32,14,270],[28,8,255],[24,6,262]]);
row("f", [[45,42,148],[46,48,66],[40,8,252],[45,58,28],[48,44,145],[50,46,70]]);
</script></body></html>
