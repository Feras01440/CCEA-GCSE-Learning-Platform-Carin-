# Cloudflare Pages: the phone-reachable preview of the static export (docs/dev/deploy.md).
# .github/workflows/deploy-preview.yml publishes CI's build of out/ to this project once the owner has added the
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets; `npx wrangler pages deploy` publishes a local
# out/ by hand after a one-time `npx wrangler login`.
# The name is the address: https://<name>.pages.dev (Cloudflare adds a suffix if the name is taken). Change it here only.
name = "cairn-preview"
pages_build_output_dir = "out"
compatibility_date = "2026-10-01"
